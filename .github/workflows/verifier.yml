name: Verify that links all works

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 */2 * *" # every 2 days at 13

concurrency:
  group: verify-links
  cancel-in-progress: false

jobs:
  verify_links:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install req
        run: |
          pip install -r requirements.txt

      - name: Update iso.json from the mirrors
        run: python3 scraper.py

      - name: Validate and substitute file
        run: |
          # Refuse to replace iso.json with something that isn't a non-empty JSON list
          jq -e 'type == "array" and length > 0' iso_updated.json > /dev/null
          mv iso_updated.json iso.json
          git diff --stat -- iso.json

      - name: Create report for iso file
        run: ./url_verifier.sh --file iso.json > report_iso.json

      - name: Create report for tools file
        run: ./url_verifier.sh --file tools.json > report_tools.json

      - name: Create report for cloudiso file
        run: ./url_verifier.sh --file cloudiso.json > report_cloudiso.json

      - name: push iso report
        uses: actions/upload-artifact@v7
        with:
          name: report_iso.json
          path: report_iso.json
          retention-days: 3

      - name: push tools report
        uses: actions/upload-artifact@v7
        with:
          name: report_tools.json
          path: report_tools.json
          retention-days: 3

      - name: push cloudiso report
        uses: actions/upload-artifact@v7
        with:
          name: report_cloudiso.json
          path: report_cloudiso.json
          retention-days: 3

      - name: Update README with status table
        run: |
          echo "| Name | Version | Status |" > table.md
          echo "|------|---------|--------|" >> table.md

          for report in report_*.json; do
            jq -r '
              .[] |
              "| \(.name) | " +
              (.os_version // "—") +
              " | " +
              (if .status >= 200 and .status < 300 then "✅"
               elif .status >= 300 and .status < 400 then "❓"
               elif .status >= 400 then "❌"
               else "NULL"  # curl could not connect
               end) +
              " |"
            ' "$report" >> table.md
          done

          # Replace section in README.md
          awk '/<!--status-start-->/{print;system("cat table.md");next} /<!--status-end-->/{print;next} 1' dummy.md > Readme.new.md
          mv Readme.new.md Readme.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Readme.md iso.json
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          if git diff --cached --quiet -- iso.json; then
            git commit -m "Update README with link status report"
          else
            git commit -m "Update iso.json from mirrors and README link status"
          fi
          git push origin main
